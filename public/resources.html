<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Learning Resources - Socials Review Desk</title>
    <link rel="stylesheet" href="./styles.css" />
    <style>
      .resources-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
        gap: 20px;
        margin-top: 24px;
      }
      .resource-card {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 12px;
        padding: 20px;
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        gap: 16px;
        transition: transform 0.2s, border-color 0.2s, box-shadow 0.2s;
      }
      .resource-card:hover {
        transform: translateY(-2px);
        border-color: var(--accent);
        box-shadow: 0 8px 24px rgba(24, 35, 29, 0.05);
      }
      .resource-card h3 {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 18px;
        margin: 0 0 8px 0;
        color: var(--ink);
      }
      .resource-card p {
        margin: 0;
        font-size: 13px;
        color: var(--muted);
        line-height: 1.5;
      }
      .resource-card .links {
        display: flex;
        flex-direction: column;
        gap: 8px;
        background: #f7faf7;
        padding: 12px;
        border-radius: 8px;
        font-size: 12px;
      }
      .resource-card .links a {
        color: #0a66c2;
        text-decoration: none;
        font-weight: 600;
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .resource-card .links a:hover {
        text-decoration: underline;
      }
      .linked-posts {
        margin-top: 8px;
        font-size: 11px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }
      .linked-posts strong {
        color: var(--ink);
        display: block;
        margin-bottom: 6px;
        font-family: 'Space Grotesk', sans-serif;
        text-transform: uppercase;
        font-size: 10px;
        letter-spacing: 0.05em;
      }
      .linked-posts ul {
        list-style: none;
        padding: 0;
        margin: 0;
        display: grid;
        gap: 4px;
      }
      .linked-posts a {
        color: var(--ink);
        text-decoration: none;
        display: block;
        padding: 4px 6px;
        background: var(--paper);
        border-radius: 4px;
        border: 1px solid transparent;
        transition: all 0.15s;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .linked-posts a:hover {
        background: var(--green-soft);
        color: var(--green);
        border-color: #cdebd9;
      }
      .search-box {
        width: 100%;
        max-width: 480px;
        padding: 12px 16px;
        font-size: 14px;
        margin-top: 16px;
      }
    </style>
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">PRIVATE LOCAL WORKSPACE</p>
          <h1>Learning Resources</h1>
          <p class="subtitle">Reference syllabus for B2B SaaS architecture, Frontend Performance, and Web Security.</p>
          <nav class="nav-tabs">
            <a href="/" class="nav-link">Review Desk</a>
            <a href="/resources.html" class="nav-link active">Learning Resources</a>
          </nav>
        </div>
        <div class="privacy">localhost only<br><span>Explore engineering topics & docs</span></div>
      </header>

      <section class="stats" id="stats">
        <div class="stat"><strong>25</strong><span>Total Concepts</span></div>
        <div class="stat"><strong>60</strong><span>Content Bank Posts</span></div>
        <div class="stat"><strong>100%</strong><span>Practical Code Links</span></div>
      </section>

      <section class="toolbar">
        <input type="text" id="searchResource" class="search-box" placeholder="Search concepts, libraries, frameworks..." />
      </section>

      <section class="resources-grid" id="resourcesGrid">
        <p class="meta">Loading resources...</p>
      </section>
    </main>

    <script type="module" src="./resources.js"></script>
  </body>
</html>
